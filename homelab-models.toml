# Homelab model registry: every model the homelab has pulled from Hugging Face, and where
# each copy is kept. **Check here before downloading weights.** `models.toml` says how
# kvllm *serves* a model; this file says where its bytes live, kvllm's or anyone else's.
#
# CLI: `just models-where <key|repo>`, `just models-unpark <key|repo>`,
#      `just models-verify <id>`, `just models-stored` (kvllm/modelstore.py).
# Every kvllm serve path checks this file first. A model missing from this host's HF cache
# but parked elsewhere is restored with `rsync -aH` and verified before vLLM starts, so it
# is not re-downloaded (KVLLM_ALLOW_DOWNLOAD=1 opts back into the download if a restore
# cannot happen).
#
# [locations.<name>]  host, path, layout:
#   "hf-cache"  path is an HF hub dir; entries are its `models--org--name` dirs (restorable).
#   "dir"       path holds plain files or directories; the model names its `entry`.
# [models.<id>]  id = the HF repo for an HF cache entry, otherwise a descriptive id.
#   hf_repo     HF repo id (an hf-cache entry). `entry` instead for a plain file or dir.
#   revision    refs/main commit when it was downloaded.
#   size_bytes  `du -sb` of the entry. downloaded = first download date, where known.
#   consumers   who uses it: "kvllm:<models.toml key>", "kodds", "ace-step", …
#   copies      locations holding a copy kept on purpose, nearest-first for a restore.
#               A copy un-parked onto kai is a working copy; record it here only if it stays.
#   source      for plain files: the HF repo they were fetched from.
# Manifests: model-sums/<entry>.sha256, sha256 of every regular file. For an hf-cache
# entry the paths are relative to its `models--…` dir; for a dir entry they are relative
# to the location. HF LFS blobs are also named by their own sha256.
#
# Seeded 2026-10-28 (sprint 26) from gratch:/nas/model-archive/MANIFEST.md + SHA256SUMS,
# and by hashing kai's and kubs0's caches. It replaces that MANIFEST's table: the archive
# MANIFEST now points here.

[locations.kai-hf]
host = "kai"
path = "/ai-data/huggingface/hub"
layout = "hf-cache"

[locations.gratch-hf]
host = "gratch"
path = "/nas/model-archive/huggingface/hub"
layout = "hf-cache"

[locations.gratch-checkpoints]
host = "gratch"
path = "/nas/model-archive/checkpoints"
layout = "dir"

[locations.kubs0-gguf]
host = "kubs0"
path = "/home/ken/models/gguf"
layout = "dir"

[locations.kubs0-hf]
host = "kubs0"
path = "/home/ken/.cache/huggingface/hub"
layout = "hf-cache"

