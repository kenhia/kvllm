[models."gemma-4-31b-it-awq"]
hf_repo = "QuantTrio/gemma-4-31B-it-AWQ"
tool_parser = "gemma4"
reasoning_parser = "gemma4"
quantization = "awq"
# Re-served as its best self (sprint 19's envelope; re-scored under it in sprint 20). fp8
# KV halves the per-token cost of its 10 full-attention layers (374.7 -> 187.4 KiB/token
# measured), so the same ~7.3 GiB pool holds 32k at 2.08x concurrency where fp16 held 16k
# at 1.27x — same 73 tok/s, unchanged answers. 49,152 also serves at 0.90 (1.75x); 32k
# unless a caller needs more. 0.95 OOMs this model at engine start, so the fraction stays
# with the deployment. ~80 s cold start, 30,826 MiB.
kv_cache_dtype = "fp8"
max_model_len = 32768
# Thinking on: the template's enable_thinking injects <|think|> and the gemma4 parser
# returns the block as `reasoning`. Sprint 19: makes its arithmetic exact and its
# aggregation reliable, at ~3x the output tokens; every board row before 2026-09-09 was
# measured with it off (the reasoning parser was configured, the switch never thrown).
chat_template_kwargs = { enable_thinking = true }
gated = false
est_vram_gb = 27
capabilities = ["chat", "code", "vision", "tools"]
tested = true
notes = "Gemma 4 dense 31B via AWQ (~19 GB). The fast second opinion and the vision candidate since 2026-09-08, not the resident (Qwen3.8 is: docs/findings/ra-interview-2026-09.md). Google claims tau2-bench 86.4 (would beat GLM-4.7-Flash) — unverified; our harness is the verifier. Multimodal. NEVER serve with on-the-fly FP8 quantization of the WEIGHTS (vllm#39049 gibberish); AWQ-marlin is the safe sm_120 path. kv_cache_dtype = fp8 quantizes the KV cache, not the weights, and is measured clean."
eval_verdict = "has issues"
eval_date = "2026-09-09"

# --- Candidate (2026-08-20, sprint 17 / korg:1474) — first NVFP4 and first video-capable
# entry in the registry. Research on korg:946.

[models."qwen3.8-27b-nvfp4"]
hf_repo = "unsloth/Qwen3.8-27B-NVFP4"
tool_parser = "qwen3_xml"
reasoning_parser = "qwen3"
# No `quantization`: the checkpoint is compressed-tensors "mixed-precision" and vLLM reads
# quant_method from quantization_config. NVFP4 on the MLPs, FP8 on attention + the last 8
# MLP blocks, vision tower left bf16 (it is in the config's `ignore` list).
kv_cache_dtype = "fp8"
# Served as sprint 19 interviewed it (sprints/sprint-19-ra-interview.md, "Qwen3.8 context
# ceilings"; envelope row mtp-120k-u95): the MTP draft head ON, 122,880 of context, and the
# GPU fraction at 0.95 — the one configuration that has both 2x decode and most of the
# window. Measured on this card: 4.80 GiB KV pool, 122,880 KV tokens at 1.0x concurrency
# (no prefix-cache headroom at full length: two concurrent long requests evict each
# other's prefixes), 31,112 MiB, 54 s cold start, ~60 tok/s. The head costs ~1.3 GiB of
# pool, so at 0.90 it caps the window at 65,536 (vLLM's estimate 75,200); without the head
# 131,072 fits at 0.90 (estimate 137,984; weights take 21.34 GiB). Fallback if 0.95
# misbehaves under a day of real load: 0.90 / 65,536 with the head — half the window,
# still 2x decode. 0.95 OOMs gemma at engine start; Qwen's lighter weights leave ~1.5 GB.
max_model_len = 122880
gpu_memory_utilization = 0.95
speculative_config = { method = "mtp", num_speculative_tokens = 3 }
# The chat template defaults reasoning_effort to 'xhigh' (its maximum). Against the judged
# and vision suites' frozen 4096-token budget that is not a capability measurement: the
# model spends the whole budget inside <think> and returns an EMPTY answer, which the judge
# grades as 0. Measured on this card at 4096: xhigh leaves plan-migration empty, medium
# answers it in 3078 tokens, low in 2948. `medium` is the highest effort that reliably fits,
# so it measures the model rather than the ceiling. The budget is the frozen ranked
# condition (judged v2 raised it 1024->4096 for exactly this reason with the 3.5/3.6
# family) and cannot move without invalidating every score on the board — so the knob that
# moves is the serve config, not the suite.
enforce_eager = true
chat_template_kwargs = { reasoning_effort = "medium" }
gated = false
est_vram_gb = 30
capabilities = ["chat", "code", "vision", "tools", "reasoning"]
tested = true
eval_verdict = "worth trying"
eval_date = "2026-09-09"
notes = "THE RESIDENT AGENT MODEL since 2026-09-08 (Ken's decision on WI-1973 after sprint 19's interview: docs/findings/ra-interview-2026-09.md). Qwen3.8 hybrid 27B (2026-08-14, Apache 2.0): Gated DeltaNet linear attention on 48 of 64 layers, full attention every 4th — which is why a 120K window is affordable here where the dense 3.6-27B needed 8K. Weights ~21 GiB. Also takes video, which nothing else here does: the path was verified by hand (sprint 17) but is NOT claimed in capabilities, because the vision suite is image-only and an unscored capability must not ride on a scored row. The MTP draft head (a separate model_mtp.safetensors, loaded by speculative_config) gave 54.1 vs 29.4 tok/s at 65,536 in sprint 18 and ~60 tok/s at 122,880/0.95 in sprint 19; since sprint 20 the board row is scored under it, so the speed factor describes what is served."

