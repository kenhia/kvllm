[project]
name = "kvllm"
version = "0.1.0"
description = "Local LLM serving on an RTX 5090 via vLLM, OpenAI-compatible /v1 for LangChain"
readme = "README.md"
# vLLM targets 3.9–3.12; pin 3.12 to avoid 3.13 wheel gaps (confirm in Sprint 1).
requires-python = ">=3.12,<3.13"
dependencies = [
    # Sprint 15: 0.24.0 -> 0.27.1. NOT 0.26.x — 0.26.1 never shipped to PyPI, and the only
    # 0.26.x (0.26.0) predates the build where Gated DeltaNet NVFP4 was verified on consumer
    # Blackwell; that line landed in 0.27.0.
    # When bumping, upgrade quack-kernels IN THE SAME `uv lock` call:
    #   uv lock --upgrade-package vllm --upgrade-package quack-kernels
    # vLLM hard-pins nvidia-cutlass-dsl==X but floors quack-kernels (>=N, no ceiling), so
    # upgrading vllm alone drags cutlass-dsl forward while uv holds quack at its locked
    # version. A stale quack then dies at kernel warm-up (AttributeError on a cutlass.cute
    # API it removed) — which looks like a serving bug, long after model load. See sprint 15.
    # Sprint 18 (WI-1736): 0.28.0 served gemma cleanly but was NOT adopted, because it
    # dragged inspect-ai 0.3.244 -> 0.3.263 (click coupling) and that harness needs
    # openai>=3.1.0 — three changes in the one measurement sprint 18 existed to make
    # trustworthy. Sprint 19 (WI-1962) adopts all three together, deliberately: vLLM
    # 0.28.0 + inspect-ai 0.3.263 + openai 3.x, re-locked in one `uv lock` call.
    # Why 0.28.0 matters for the resident-model candidate: fused MTP decode kernel for
    # Qwen3.5-family GDN (#51674), GDN gates aligned with speculative tokens (#51812),
    # and a thinking_token_budget control (#46727).
    "vllm>=0.28.0,<0.29",
]

[dependency-groups]
test = [
    "langchain-core>=1.4.8",
    "langchain-openai>=1.3.3",
    "openai>=3.1.0",
]
dev = [
    "ruff>=0.14.0",
    "pytest>=8.3.0",
]
helper = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
]
eval = [
    # inspect-ai 0.3.263's Anthropic provider (the judge) checks anthropic>=1.0.0 at
    # runtime, like the openai floor below — found by the sprint-19 harness smoke, where
    # `judged` recorded no scores because every judge call died with a PrerequisiteError.
    "anthropic>=1.0.0",
    # Floored again (sprint 19, WI-1962). Sprint 18 PINNED this at 0.3.244 so a serving
    # bump could not drag the eval harness forward as a silent rider; that was the right
    # call for a re-baseline sprint and the wrong shape to leave in place. The floor is the
    # version the vLLM 0.28.0 resolve lands on. Bumping it later moves the harness out from
    # under the measured noise floor (eval-config.toml [noise]) — re-measure when you do.
    "inspect-ai>=0.3.263",
    # inspect-ai's OpenAI-compatible provider checks this AT RUNTIME (PrerequisiteError,
    # one suite into a run), not in its package metadata — so the floor has to be here.
    "openai>=3.1.0",
    "tomlkit>=0.15.0",
]

# Use a uv-managed CPython (python-build-standalone) — it ships the dev headers (Python.h)
# that vLLM/Triton need to JIT-compile CUDA helpers at startup. System python3.12 has none.
[tool.uv]
python-preference = "only-managed"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]  # import sorting

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
