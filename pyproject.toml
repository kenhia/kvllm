[project]
name = "kvllm"
version = "0.1.0"
description = "Local LLM serving on an RTX 5090 via vLLM, OpenAI-compatible /v1 for LangChain"
readme = "README.md"
# vLLM targets 3.9–3.12; pin 3.12 to avoid 3.13 wheel gaps (confirm in Sprint 1).
requires-python = ">=3.12,<3.13"
dependencies = [
    # Sprint 15: 0.24.0 -> 0.27.1. NOT 0.26.x — 0.26.1 never shipped to PyPI, and the only
    # 0.26.x (0.26.0) predates the build where Gated DeltaNet NVFP4 was verified on consumer
    # Blackwell; that line landed in 0.27.0.
    # When bumping, upgrade quack-kernels IN THE SAME `uv lock` call:
    #   uv lock --upgrade-package vllm --upgrade-package quack-kernels
    # vLLM hard-pins nvidia-cutlass-dsl==X but floors quack-kernels (>=N, no ceiling), so
    # upgrading vllm alone drags cutlass-dsl forward while uv holds quack at its locked
    # version. A stale quack then dies at kernel warm-up (AttributeError on a cutlass.cute
    # API it removed) — which looks like a serving bug, long after model load. See sprint 15.
    "vllm>=0.27.1,<0.28",
]

[dependency-groups]
test = [
    "langchain-core>=1.4.8",
    "langchain-openai>=1.3.3",
    "openai>=2.44.0",
]
dev = [
    "ruff>=0.14.0",
    "pytest>=8.3.0",
]
helper = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
]
eval = [
    "anthropic>=0.115.0",
    "inspect-ai>=0.3.244",
    "tomlkit>=0.15.0",
]

# Use a uv-managed CPython (python-build-standalone) — it ships the dev headers (Python.h)
# that vLLM/Triton need to JIT-compile CUDA helpers at startup. System python3.12 has none.
[tool.uv]
python-preference = "only-managed"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]  # import sorting

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
