[project]
name = "kvllm"
version = "0.1.0"
description = "Local LLM serving on an RTX 5090 via vLLM, OpenAI-compatible /v1 for LangChain"
readme = "README.md"
# vLLM targets 3.9–3.12; pin 3.12 to avoid 3.13 wheel gaps (confirm in Sprint 1).
requires-python = ">=3.12,<3.13"
dependencies = [
    # Sprint 15: 0.24.0 -> 0.27.1. NOT 0.26.x — 0.26.1 never shipped to PyPI, and the only
    # 0.26.x (0.26.0) predates the build where Gated DeltaNet NVFP4 was verified on consumer
    # Blackwell; that line landed in 0.27.0.
    # When bumping, upgrade quack-kernels IN THE SAME `uv lock` call:
    #   uv lock --upgrade-package vllm --upgrade-package quack-kernels
    # vLLM hard-pins nvidia-cutlass-dsl==X but floors quack-kernels (>=N, no ceiling), so
    # upgrading vllm alone drags cutlass-dsl forward while uv holds quack at its locked
    # version. A stale quack then dies at kernel warm-up (AttributeError on a cutlass.cute
    # API it removed) — which looks like a serving bug, long after model load. See sprint 15.
    # Sprint 18 (WI-1736): 0.28.0 EVALUATED, NOT ADOPTED — and the blocker is not
    # serving. 0.28.0 serves gemma-4-31b-it-awq cleanly (30,746 MiB, 7.31 GiB KV pool,
    # vs 30,846 / 7.42 on 0.27.1). It is unadoptable *here* because it requires
    # click>=8.4.2 while inspect-ai 0.3.244 requires click<8.2.2, so taking 0.28.0
    # forces inspect-ai to 0.3.263, which in turn requires openai>=3.1.0 — i.e. the
    # serving bump drags the EVAL HARNESS forward as a rider. That would confound the
    # hardware change, the vLLM change and the harness change in one measurement, and
    # move the board out from under sprint 16's noise floor (0.036). Adopt 0.28.0 as
    # its own sprint, paired with the inspect-ai bump and a re-measured floor.
    "vllm>=0.27.1,<0.28",
]

[dependency-groups]
test = [
    "langchain-core>=1.4.8",
    "langchain-openai>=1.3.3",
    "openai>=2.44.0",
]
dev = [
    "ruff>=0.14.0",
    "pytest>=8.3.0",
]
helper = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
]
eval = [
    "anthropic>=0.115.0",
    # PINNED, not floored (sprint 18). The vLLM 0.28.0 re-resolve dragged this to
    # 0.3.263, whose OpenAI-compatible provider requires openai>=3.1.0 and aborts the
    # suites outright. Chasing it forward would also move the eval harness out from
    # under sprint 16's measured noise floor (composite band 0.036), which every gap
    # on the board is read against. Hold it here; bump deliberately, with a re-measured
    # floor, not as a rider on a serving-stack change.
    "inspect-ai==0.3.244",
    "tomlkit>=0.15.0",
]

# Use a uv-managed CPython (python-build-standalone) — it ships the dev headers (Python.h)
# that vLLM/Triton need to JIT-compile CUDA helpers at startup. System python3.12 has none.
[tool.uv]
python-preference = "only-managed"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]  # import sorting

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
