# Eval harness scoring configuration (planning/03). Re-weighting here re-ranks the
# leaderboard on the next `just eval`/`just eval-all` run — no model re-runs needed
# (`just board-rebuild` regenerates the leaderboard from the existing scorecards).

# Composite = speed_factor × Σ(weight_i × suite_score_i) / Σ(weight_i), over the suites a model
# is ELIGIBLE for (has current-version scores). Weights renormalize over eligible suites, so a
# model without a vision suite isn't penalized for it. A suite with weight 0 is shown, not ranked.
[weights]
tools = 0.30
code = 0.35
agentic = 0.25 # suite lands in Phase 4
judged = 0.10
# Bumped 2026-07-03 (sprint 11): 7 vision models scored on S5 v1 — the roadmap's ≥3 rule.
# Weights renormalize over eligible suites, so text-only models are unaffected.
vision = 0.15
# assisted: agentic under controller scaffolding (bigger budget + wrap-up demand). Weight 0
# BY DESIGN: it's a labeled alternate condition — shown on the board, never ranked, so the
# raw-autonomy comparison stays honest. The assisted-vs-agentic delta is the measurement
# (model-research/agentic-gap-2026-07.md). Opt-in: `just eval <key> --suite assisted`.
assisted = 0.0

# Speed multiplier on the composite, from the gate's decode tok/s:
# ≤ floor → 0.5 (and the verdict is capped at "has issues"); ≥ full → 1.0; linear between.
[speed]
floor_tok_s = 10
full_tok_s = 40

# Verdict derivation (replaces the v1 all-suites-≥0.8 rule, which flagged every model
# "has issues" once genuinely hard suites landed):
#   skip       = failed the operational gate
#   has issues = composite < composite_floor, or decode at/below the speed floor,
#                or any weighted suite < suite_floor
#   worth trying = otherwise
[verdict]
composite_floor = 0.55
suite_floor = 0.40

# Where suite sandboxes run (planning/04). Inspect drives `docker compose` here for the
# coding/agentic suites; empty = kai's local Docker. An explicit DOCKER_HOST env var overrides.
# ssh:// needs the ControlMaster block in ~/.ssh/config (Host ksandbox) — without multiplexing,
# concurrent compose calls storm sshd MaxStartups and episodes die with "No services started".
[sandbox]
docker_host = "ssh://ken@ksandbox"

[judge]
model = "anthropic/claude-haiku-4-5-20251001"
# Calibrated 2026-07-02: 12/12 of Ken's hand scores within ±1 of the judge (mean |Δ| 0.42) —
# see model-research/evals/calibration/judged-sheet.md. Re-run the protocol if the judge
# model changes.
calibrated = true

# API pricing per MTok for baseline cost estimates:
# est $ = in×input + out×output + cache_read×0.1×input + cache_write×1.25×input, per MTok.
# Sonnet 5 is $2/$10: the models overview (platform.claude.com, checked 2026-09-09) lists
# no intro period. An earlier note here said it would revert to $3/$15 after 2026-08-31;
# it did not, so every Sonnet card since 2026-07-02 is priced consistently.
[pricing."anthropic/claude-haiku-4-5"]
input = 1.00
output = 5.00

[pricing."anthropic/claude-sonnet-5"]
input = 2.00
output = 10.00

[pricing."anthropic/claude-opus-4-8"]
input = 5.00
output = 25.00

[pricing."anthropic/claude-haiku-4-5-20251001"] # judge model id (same pricing as haiku alias)
input = 1.00
output = 5.00

# Measured run-to-run band. N=3 repeats of the SAME model on the same night via
# `just eval-repeat <key> --n 3`; raw per-run cards in model-research/evals/noise-floor/.
#
# 2026-09-09 (sprint 21, korg:1998): every weighted suite repeated, all three rows on the
# sprint-19/20 harness (vLLM 0.28.0, inspect-ai 0.3.263) on the same board day:
#
#   suite      claude-sonnet-5         qwen3.8-27b-nvfp4       gemma-4-31b-it-awq
#   tools      1.00–1.00  (0.000)      1.00–1.00  (0.000)      1.00–1.00  (0.000)
#   code       1.00–1.00  (0.000)      0.99–1.00  (0.010)      0.93–1.00  (0.070)
#   agentic    0.66–0.84  (0.180)      0.66–0.83  (0.170)      0.33–0.50  (0.170)
#   judged     0.90–0.97  (0.070)      0.97–0.97  (0.000)      0.68–0.85  (0.170)
#   vision     0.93–0.97  (0.040)      0.93–0.97  (0.040)      0.97–1.00  (0.030)
#   composite  0.908–0.955 (0.047)     0.911–0.951 (0.040)     0.801–0.871 (0.070)
#
# composite_band is the WIDEST composite range measured on the current stack. That is the
# 2026-08-20 rule, unchanged: a comparison involves both models, so the noisier one
# governs. What changed is which row that is. On 2026-08-20 it was the hosted baseline
# (sonnet 0.036 vs gemma 0.007), because a local model at temperature 0.0 is close to
# deterministic; since sprint 20 the local rows run at their served generation configs
# (Qwen T=1.0/top-p 0.95, gemma thinking on), and on 2026-09-09 the noisier row is gemma:
# 0.070, against sonnet 0.047 and qwen 0.040. A floor narrower than a measured local band
# would let a local-vs-local gap be read as a finding, which is exactly what this number
# exists to prevent. (Overseer ruling on korg:1998; sprint 21's record has the board effect.)
#
# Still a LOWER bound: all repeats ran in one night, so provider drift on the hosted row
# is held roughly constant.
[noise]
measured = "2026-09-09"
n = 3
composite_band = 0.070
